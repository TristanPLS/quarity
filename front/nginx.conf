server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API -> back (nom de service docker-compose). Évite tout CORS (même origine côté navigateur).
  location /api/ {
    proxy_pass http://back:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Préparé pour le WebSocket d'alertes (Jalon 3) :
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # SPA fallback : toute route inconnue renvoie index.html (react-router gère le routing).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache long pour les assets fingerprintés de Vite.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
