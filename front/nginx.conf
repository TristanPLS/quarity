server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # En-têtes de sécurité (CSP validée en navigateur le 2026-06-07 — mission A1).
  # NB nginx : add_header n'est PAS hérité par un bloc location qui déclare son propre
  # add_header → le bloc /assets/ ci-dessous les répète volontairement.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  # CSP du SPA : tout en same-origin ('self'). 'unsafe-inline' UNIQUEMENT pour style-src
  # (styles inline posés par React/Recharts) ; data: pour font-src (fallbacks woff embarqués
  # dans le CSS @fontsource). connect-src 'self' couvre /api ; à étendre pour le WebSocket
  # d'alertes au Jalon 3 (selon navigateurs : ajouter ws:/wss: même origine).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # API -> back (nom de service docker-compose). Évite tout CORS (même origine côté navigateur).
  location /api/ {
    proxy_pass http://back:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Préparé pour le WebSocket d'alertes (Jalon 3) :
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # SPA fallback : toute route inconnue renvoie index.html (react-router gère le routing).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache long pour les assets fingerprintés de Vite (un seul Cache-Control —
  # `expires` générerait un en-tête dupliqué).
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    # add_header local ⇒ ré-déclarer les en-têtes de sécurité (non hérités, cf. plus haut).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }
}
