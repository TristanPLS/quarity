<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="349px" preserveAspectRatio="none" style="width:997px;height:349px;background:#FFFFFF;" version="1.1" viewBox="0 0 997 349" width="997px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="411" x="286" y="24.5332">UC4 - etat pre-sequence (avant declenchement de l'alerte)</text><g id="elem_index_regles"><rect fill="#F1F1F1" height="47.2188" style="stroke:#181818;stroke-width:0.5;" width="589" x="7" y="170.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="257" x="173" y="187.1426">index : RuleIndex (Moka L1, en memoire)</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="595" y1="192.2188" y2="192.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="577" x="13" y="210.752">cle (station 1001, pm25) = regle id 3, comparator "&gt;", seuil 15.0, severity warning, org_id 42</text></g><g id="elem_clickhouse"><rect fill="#F1F1F1" height="47.2188" style="stroke:#181818;stroke-width:0.5;" width="445" x="79" y="45.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="136" x="233.5" y="62.1426">mesures : ClickHouse</text><line style="stroke:#181818;stroke-width:0.5;" x1="80" x2="523" y1="67.2188" y2="67.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="433" x="85" y="85.752">nouvelle arrivee = station 1001, pm25 = 50, ingested_at &gt; watermark</text></g><g id="elem_events"><rect fill="#F1F1F1" height="47.2188" style="stroke:#181818;stroke-width:0.5;" width="368" x="117.5" y="295.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="223" x="190" y="312.1426">events : alert_events (PostgreSQL)</text><line style="stroke:#181818;stroke-width:0.5;" x1="118.5" x2="484.5" y1="317.2188" y2="317.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="356" x="123.5" y="335.752">etat = aucun event pour (regle 3, capteur, measured_at)</text></g><g id="elem_session_ws"><rect fill="#F1F1F1" height="47.2188" style="stroke:#181818;stroke-width:0.5;" width="371" x="619" y="45.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="187" x="711" y="62.1426">session : WebSocket (org 42)</text><line style="stroke:#181818;stroke-width:0.5;" x1="620" x2="989" y1="67.2188" y2="67.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="359" x="625" y="85.752">etat = ouverte, enregistree dans AlertHub sous org_id 42</text></g><g id="elem_panneau_front"><rect fill="#F1F1F1" height="47.2188" style="stroke:#181818;stroke-width:0.5;" width="347" x="631" y="170.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="221" x="694" y="187.1426">panneau : AlertsPanel (navigateur)</text><line style="stroke:#181818;stroke-width:0.5;" x1="632" x2="977" y1="192.2188" y2="192.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="335" x="637" y="210.752">etat = liste d'alertes courante (sans ce depassement)</text></g><!--link clickhouse to index_regles--><g id="link_clickhouse_index_regles"><path codeLine="23" d="M301.5,92.6694 C301.5,114.7194 301.5,142.1294 301.5,164.2794 " fill="none" id="clickhouse-to-index_regles" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="301.5,170.2794,305.5,161.2794,301.5,165.2794,297.5,161.2794,301.5,170.2794" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="83" x="302.5" y="137.1045">evaluee contre</text></g><!--link index_regles to events--><g id="link_index_regles_events"><path codeLine="24" d="M301.5,217.6694 C301.5,239.7194 301.5,267.1294 301.5,289.2794 " fill="none" id="index_regles-to-events" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="301.5,295.2794,305.5,286.2794,301.5,290.2794,297.5,286.2794,301.5,295.2794" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="120" x="302.5" y="262.1045">(aucun event encore)</text></g><!--link session_ws to panneau_front--><g id="link_session_ws_panneau_front"><path codeLine="25" d="M804.5,92.6694 C804.5,114.7194 804.5,142.1294 804.5,164.2794 " fill="none" id="session_ws-to-panneau_front" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="804.5,170.2794,808.5,161.2794,804.5,165.2794,800.5,161.2794,804.5,170.2794" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="49" x="805.5" y="137.1045">alimente</text></g><!--SRC=[RP91Rzim38Nl_XL4BdC0PqYwvXAW0OfUEg03kXN3ZWPZiwuMMV8eoTqmxB-Fb8tDmNOJPShVu-EB9bg2ptVNi06A665WsWJwbiWr12MEw2Aqr5YfNwYdN85zWvOuqhee_EahDH5MnhNq7GxmALbwdy_b1tz6UDXLG0vwwhrXMgy00-JUcgcp5E1d0I2_Xp88tdW7k-rMtWpzrNuDDv2xmBJmheB6zmCoHi-mEgug29ICXTt-xLRF8x69F-0LsHdNLU2vg-NTzLNnww_Cda9YeHxWpfhcVEzJeAofqV95owp8-JII5J8ocv58bFohJoxtWXOQXKXjBVOTXH-9U-Jp4YlYN5HgzgsUo_BHXzWnFNryc8oPxrL0NiODO6gIc-vXy8cXd0nHDt28bBWIRr67Klvw2GqKWWe-m1SwFVdcJ15ASKKicN1pG_rwWTJ9PRUwDc6P45d6Rz45k5Nnz-a4GNpwlxy3EaUOX9cRmoCwib0w74s7AdSYpstrCtiPR06tmXFQd2zPYymi4THug0B9P4i3Xf2ZcATTB6wpELvcwo3EeKsYln4EKt7nLTl_BAPSEYrXznBMOc6GDb-grcKQbK6_0G00]--></g></svg>