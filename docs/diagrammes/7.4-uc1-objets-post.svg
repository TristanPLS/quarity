<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="295px" preserveAspectRatio="none" style="width:663px;height:295px;background:#FFFFFF;" version="1.1" viewBox="0 0 663 295" width="663px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="346" x="151.5" y="24.5332">UC1 - etat post-sequence (apres authentification)</text><g id="elem_utilisateur_navigateur"><rect fill="#F1F1F1" height="82.4375" style="stroke:#181818;stroke-width:0.5;" width="422" x="36" y="45.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="141" x="176.5" y="62.1426">utilisateur : Navigateur</text><line style="stroke:#181818;stroke-width:0.5;" x1="37" x2="457" y1="67.2188" y2="67.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="106" x="42" y="85.752">etat = authentifie</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="410" x="42" y="103.3613">access_token = JWT HS256 (sub, org_id, role, can_write, jti, exp)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="206" x="42" y="120.9707">refresh_token = UUID v4 opaque</text></g><g id="elem_compte_pg"><rect fill="#F1F1F1" height="64.8281" style="stroke:#181818;stroke-width:0.5;" width="138" x="7" y="214.1094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="124" x="14" y="230.6426">users : PostgreSQL</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="144" y1="235.7188" y2="235.7188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="98" x="13" y="254.252">etat = inchange</text><text fill="#000000" font-family="sans-serif" font-siz