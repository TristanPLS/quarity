<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="490px" preserveAspectRatio="none" style="width:827px;height:490px;background:#FFFFFF;" version="1.1" viewBox="0 0 827 490" width="827px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="419" x="197" y="24.5332">UC4 - etat post-sequence (apres declenchement de l'alerte)</text><g id="elem_events"><rect fill="#F1F1F1" height="170.4844" style="stroke:#181818;stroke-width:0.5;" width="296" x="153.5" y="45.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="223" x="190" y="62.1426">events : alert_events (PostgreSQL)</text><line style="stroke:#181818;stroke-width:0.5;" x1="154.5" x2="448.5" y1="67.2188" y2="67.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="284" x="159.5" y="85.752">etat = nouvel event insere (snapshot fige T4)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="72" x="159.5" y="103.3613">org_id = 42</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="155" x="159.5" y="120.9707">parameter_code = pm25</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="137" x="159.5" y="138.5801">measured_value = 50</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="145" x="159.5" y="156.1895">threshold_value = 15.0</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="106" x="159.5" y="173.7988">comparator = "&gt;"</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="114" x="159.5" y="191.4082">severity = warning</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="99" x="159.5" y="209.0176">fired_at = now()</text></g><g id="elem_compteur_non_lus"><rect fill="#F1F1F1" height="47.2188" style="stroke:#181818;stroke-width:0.5;" width="325" x="7" y="293.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="149" x="95" y="310.1426">compteur : non-lus (T6)</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="331" y1="315.2188" y2="315.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="313" x="13" y="333.752">etat = incremente pour la ligne reellement inseree</text></g><g id="elem_canal_redis"><rect fill="#F1F1F1" height="47.2188" style="stroke:#181818;stroke-width:0.5;" width="453" x="367" y="293.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="213" x="487" y="310.1426">canal : Redis quarity:alerts:org:42</text><line style="stroke:#181818;stroke-width:0.5;" x1="368" x2="819" y1="315.2188" y2="315.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="441" x="373" y="333.752">etat = message AlertMessage { type alert, event } publie et consomme</text></g><g id="elem_panneau_front"><rect fill="#F1F1F1" height="64.8281" style="stroke:#181818;stroke-width:0.5;" width="369" x="409" y="418.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="221" x="483" y="435.1426">panneau : AlertsPanel (navigateur)</text><line style="stroke:#181818;stroke-width:0.5;" x1="410" x2="777" y1="440.2188" y2="440.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="357" x="415" y="458.752">etat = alerte affichee en tete de liste, sans rechargement</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength=