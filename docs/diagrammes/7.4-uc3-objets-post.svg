<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="490px" preserveAspectRatio="none" style="width:877px;height:490px;background:#FFFFFF;" version="1.1" viewBox="0 0 877 490" width="877px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="373" x="245" y="24.5332">UC3 - etat post-sequence (apres creation de la regle)</text><g id="elem_regle_creee"><rect fill="#F1F1F1" height="170.4844" style="stroke:#181818;stroke-width:0.5;" width="249" x="255.5" y="170.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="202" x="279" y="187.1426">regle : alert_rules (PostgreSQL)</text><line style="stroke:#181818;stroke-width:0.5;" x1="256.5" x2="503.5" y1="192.2188" y2="192.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="82" x="261.5" y="210.752">id = nouveau</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="72" x="261.5" y="228.3613">org_id = 42</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="221" x="261.5" y="245.9707">tracked_location_id = 7 (immuable)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="209" x="261.5" y="263.5801">parameter_id = pm25 (immuable)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="106" x="261.5" y="281.1895">comparator = "&gt;"</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="169" x="261.5" y="298.7988">threshold_value = 15.0000</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="237" x="261.5" y="316.4082">severity = warning puis valeur PATCH</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="91" x="261.5" y="334.0176">status = active</text></g><g id="elem_journal_audit"><rect fill="#F1F1F1" height="64.8281" style="stroke:#181818;stroke-width:0.5;" width="298" x="7" y="418.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="87" x="112.5" y="435.1426">audit_log : T5</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="304" y1="440.2188" y2="440.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="149" x="13" y="458.752">creation = action create</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="286" x="13" y="476.3613">edition = action update ou activate/deactivate</text></g><g id="elem_index_matching"><rect fill="#F1F1F1" height="47.2188" style="stroke:#181818;stroke-width:0.5;" width="530" x="340" y="427.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="168" x="521" y="444.1426">index : boucle de matching</text><line style="stroke:#181818;stroke-width:0.5;" x1="341" x2="869" y1="449.2188" y2="449.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="518" x="346" y="467.752">etat = regle prise en compte au tick suivant l'expiration du cache Moka (TTL court)</text></g><g id="elem_gestionnaire_navigateur"><rect fill="#F1F1F1" height="47.2188" style="stroke:#181818;stroke-width:0.5;" width="313" x="223.5" y="45.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="158" x="301" y="62.1426">gestionnaire : Navigateur</text><line style="stroke:#181818;stroke-width:0.5;" x1="224.5" x2="535.5" y1="67.2188" y2="67.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="301" x="229.5" y="85.752">etat = regle (201) ou regle modifiee (200) recue</text></g><!--link regle_creee to journal_audit--><g id="link_regle_creee_journal_audit"><path codeLine="27" d="M282.73,340.6394 C250.73,368.2794 221.6409,393.4076 197.0709,414.6276 " fill="none" id="regle_creee-to-journal_audit" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="192.53,418.5494,201.9559,415.694,196.3141,415.2812,196.7268,409.6395,192.53,418.5494" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="105" x="249" y="385.1045">trace l'action dans</text></g><!--link regle_creee to index_matching--><g id="link_regle_creee_index_matching"><path codeLine="28" d="M477.71,340.6394 C514.47,372.2594 548.8306,401.8074 573.8106,423.2874 " fill="none" id="regle_creee-to-index_matching" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="578.36,427.1994,574.1439,418.2986,574.5689,423.9394,568.928,424.3644,578.36,427.1994" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="115" x="533" y="385.1045">prise en compte par</text></g><!--link gestionnaire_navigateur to regle_creee--><g id="link_gestionnaire_navigateur_regle_creee"><path codeLine="29" d="M380,92.7294 C380,112.2694 380,135.7594 380,164.2394 " fill="none" id="gestionnaire_navigateur-to-regle_creee" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="380,170.2394,384,161.2394,380,165.2394,376,161.2394,380,170.2394" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="90" x="381" y="137.1045">recoit (201/200)</text></g><!--SRC=[TL9DRzim3BtxLn2vr3vaJRC50mAqGD7B3jtGOTdPO2JMKIDB7YLv7ORzzr5osxaDffF8nu_7HqOJBS7tc_Um18eOOV0XBWFzIEGKGOq3Km35XD5u1vh08Z1rbfggyli7KX4MnOOje2MEBIShAVMT5EgOldszRHQ0OKfgfH8H_Au0Z8PBS3wDX4bCprrRN1_MOaL6TIJTMgzAumdw2BNf-u