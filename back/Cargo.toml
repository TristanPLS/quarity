[package]
name = "quarity-back"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Quarity — API back (walking skeleton) : auth JWT + lecture des mesures OpenAQ"

[dependencies]
# --- Web / async (axum 0.8) — feature `ws` : endpoint WebSocket des alertes (B8) ---
axum       = { version = "0.8", features = ["ws"] }
tokio      = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "set-header"] }
# --- Streams (B8) : consommation du flux Redis pub/sub des alertes (PSUBSCRIBE) ---
futures-util = "0.3"

# --- Postgres (métier) : requêtes RUNTIME (pas de macros compile-time) ---
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "postgres",
    "macros",            # uniquement pour #[derive(FromRow)]
    "migrate",           # migrations embarquées (sqlx::migrate! sur back/migrations/, appliquées au boot)
    "chrono",            # TIMESTAMPTZ <-> chrono::DateTime<Utc> (DTOs CRUD B6)
] }

# --- Redis (refresh tokens) ---
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# --- ClickHouse via HTTP ---
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# --- Ingestion OpenAQ (binaire ingest) + timestamps des DTOs CRUD (B6) ---
chrono = { version = "0.4", features = ["clock", "serde"] }

# --- Cache L1 in-process (B7) : index des règles de matching, lookup mémoire pur ---
moka = { version = "0.12", features = ["future"] }

# --- Auth / crypto ---
argon2       = "0.5"
jsonwebtoken = "9"
uuid         = { version = "1", features = ["v4"] }

# --- Sérialisation ---
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Doc OpenAPI /api/docs (A2) — `vendored` : Swagger UI embarqué, zéro réseau au build (Docker/CI) ---
utoipa            = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }

# --- Validation des inputs au boundary (A5) ---
validator = { version = "0.20", features = ["derive"] }

# --- Observabilité / erreurs ---
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow             = "1"
thiserror          = "1"

# Client WebSocket des tests e2e B8 (tests/b8_alerts.rs) — `connect` seul (ws:// sans TLS).
[dev-dependencies]
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
