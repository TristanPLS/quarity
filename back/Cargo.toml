[package]
name = "quarity-back"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Quarity — API back (walking skeleton) : auth JWT + lecture des mesures OpenAQ"

[dependencies]
# --- Web / async (axum 0.8) ---
axum       = "0.8"
tokio      = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "set-header"] }

# --- Postgres (métier) : requêtes RUNTIME (pas de macros compile-time) ---
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "postgres",
    "macros",            # uniquement pour #[derive(FromRow)]
] }

# --- Redis (refresh tokens) ---
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# --- ClickHouse via HTTP ---
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# --- Ingestion OpenAQ (binaire ingest) ---
chrono = { version = "0.4", features = ["clock"] }

# --- Auth / crypto ---
argon2       = "0.5"
jsonwebtoken = "9"
uuid         = { version = "1", features = ["v4"] }

# --- Sérialisation ---
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Observabilité / erreurs ---
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow             = "1"
thiserror          = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
