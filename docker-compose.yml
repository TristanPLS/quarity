name: quarity

# =============================================================================
# Quarity — Walking skeleton, socle bases de données (Jalon 2)
# =============================================================================
# `docker compose up -d` lève Postgres + ClickHouse + Redis + back + front
# + ingest-scheduler (ingestion OpenAQ périodique, A6a), avec healthchecks et
# volumes nommés (persistance).
#
# Ordre de boot Postgres : le SCHÉMA est appliqué par le BACK au démarrage
# (migrations sqlx — back/migrations/, cf. back/src/main.rs). Plus d'initdb.d
# côté Postgres. Le seed de démonstration est un service one-shot opt-in :
#   docker compose --profile seed run --rm seed     (après le 1er boot du back)
# ClickHouse conserve son initdb.d (schéma + seed au premier démarrage).
#
# Prérequis : `cp .env.example .env` puis renseigner les valeurs (aucun secret en dur ici).
# =============================================================================

services:

  # --- PostgreSQL 16 — source de vérité OLTP métier ---
  postgres:
    image: postgres:16-alpine
    container_name: quarity_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # plus d'initdb.d : le schéma vient des migrations sqlx du back (back/migrations/)
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --- Seed démo Postgres (one-shot, opt-in) ---
  # `docker compose --profile seed run --rm seed` — à lancer APRÈS le premier
  # démarrage du back (les tables sont créées par ses migrations sqlx).
  # Rejouable : 02_seed.sql fait TRUNCATE … RESTART IDENTITY CASCADE en tête.
  seed:
    image: postgres:16-alpine
    profiles: ["seed"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./db/sql/02_seed.sql:/seed/02_seed.sql:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/seed/02_seed.sql"]
    depends_on:
      postgres: { condition: service_healthy }

  # --- ClickHouse 24.x — source de vérité analytics (mesures) ---
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: quarity_clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"     # interface HTTP
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"   # protocole natif (driver)
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./db/clickhouse/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/clickhouse/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user $$CLICKHOUSE_USER --password $$CLICKHOUSE_PASSWORD --query 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --- Redis 7 — cache L2 + pub/sub (WebSocket) ---
  redis:
    image: redis:7-alpine
    container_name: quarity_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}   # exposé au conteneur pour que le healthcheck puisse l'utiliser
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- Back Rust/Axum — auth JWT + lecture des mesures (walking skeleton) ---
  back:
    build: ./back
    image: quarity-back:local
    container_name: quarity_back
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      REFRESH_TTL_SECS: ${REFRESH_TTL_SECS:-604800}
      RATE_LIMIT_LOGIN_EMAIL_PER_MIN: ${RATE_LIMIT_LOGIN_EMAIL_PER_MIN:-5}
      RATE_LIMIT_LOGIN_IP_PER_MIN: ${RATE_LIMIT_LOGIN_IP_PER_MIN:-20}
      RATE_LIMIT_REFRESH_IP_PER_MIN: ${RATE_LIMIT_REFRESH_IP_PER_MIN:-30}
      BIND_ADDR: 0.0.0.0:8080
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Boucle de matching B7 (mesures ingérées × règles actives → alert_events) —
      # forwarding EXPLICITE (leçon PR #19 : rien ne passe tout seul). 0 = désactivée.
      MATCHING_INTERVAL_SECS: ${MATCHING_INTERVAL_SECS:-300}
      MATCHING_RULES_TTL_SECS: ${MATCHING_RULES_TTL_SECS:-60}
      MATCHING_LOOKBACK_SECS: ${MATCHING_LOOKBACK_SECS:-3600}
      MATCHING_BATCH_LIMIT: ${MATCHING_BATCH_LIMIT:-50000}
      # Alertes temps reel B8 (Redis pub/sub par org -> WebSocket /api/ws) —
      # forwarding EXPLICITE (lecon PR #19 : rien ne passe tout seul).
      WS_PING_INTERVAL_SECS: ${WS_PING_INTERVAL_SECS:-30}
      WS_CLIENT_BUFFER: ${WS_CLIENT_BUFFER:-64}
    ports:
      - "${BACK_PORT:-8080}:8080"
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      # /health ne répond qu'une fois le serveur en écoute — donc APRÈS l'application des
      # migrations sqlx (main.rs migre AVANT axum::serve). Permet à ingest-scheduler d'attendre
      # `service_healthy` au lieu de courir contre les migrations au 1er tick. curl est fourni
      # par l'image runtime (back/Dockerfile). /health renvoie toujours 200 (le statut
      # ok/degraded est dans le corps) → un 200 suffit à prouver « serveur prêt = migrations OK ».
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- Ingestion OpenAQ (one-shot) — `docker compose --profile ingest run --rm ingest [location_id]` ---
  # Nécessite OPENAQ_API_KEY dans .env. Insère les mesures dans ClickHouse + lie la station à l'org.
  ingest:
    build: ./back
    image: quarity-back:local
    profiles: ["ingest"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      OPENAQ_API_KEY: ${OPENAQ_API_KEY}
      OPENAQ_LOCATION_ID: ${OPENAQ_LOCATION_ID:-4085}
      OPENAQ_DAYS: ${OPENAQ_DAYS:-7}
      OPENAQ_ORG_SLUG: ${OPENAQ_ORG_SLUG:-agglo-riviera}
      OPENAQ_MAX_PAGES: ${OPENAQ_MAX_PAGES:-50}
    entrypoint: ["quarity-ingest"]
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }

  # --- Scheduler d'ingestion OpenAQ (long-running) — démarre avec `docker compose up -d` ---
  # Boucle tokio DANS le binaire (INGEST_INTERVAL_SECS > 0) : premier run immédiat, puis un run
  # toutes les INGEST_INTERVAL_SECS secondes (défaut 3600 = 1 run/heure, très confortable face au
  # rate-limit OpenAQ ~60 req/min : un run = ~4-7 requêtes).
  # Fenêtre OPENAQ_DAYS=1 par défaut (INGEST_SCHEDULER_DAYS) : couvre le retard de publication
  # OpenAQ tout en divisant par 7 le bruit des MV rollup vs la fenêtre 7 j du one-shot (chaque
  # ré-insertion re-déclenche les MV AVANT dédup — cf. db/clickhouse/01_schema.sql §C.4).
  # depends_on : back en service_healthy (son healthcheck /health ne passe qu'une fois les
  # migrations sqlx appliquées et le serveur en écoute) → le 1er tick ne court plus contre les
  # migrations. NB : l'org agglo-riviera n'existe TOUJOURS qu'après le seed (profil seed) ; un
  # tick antérieur au seed ÉCHOUE proprement (erreur logguée) et est RETENTÉ au tick suivant —
  # pas de crash du conteneur.
  # ⚠ Ne PAS poser INGEST_INTERVAL_SECS=0 dans l'env hôte : sur CE service le binaire ferait un
  # one-shot puis exit 0, et `restart: unless-stopped` le relancerait en BOUCLE SERRÉE (spam
  # OpenAQ). Pour suspendre le scheduler : `docker compose stop ingest-scheduler` (cf. .env.example).
  ingest-scheduler:
    build: ./back
    image: quarity-back:local
    container_name: quarity_ingest_scheduler
    restart: unless-stopped
    entrypoint: ["quarity-ingest"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      OPENAQ_API_KEY: ${OPENAQ_API_KEY}
      OPENAQ_LOCATION_ID: ${OPENAQ_LOCATION_ID:-4085}
      OPENAQ_DAYS: ${INGEST_SCHEDULER_DAYS:-1}
      OPENAQ_ORG_SLUG: ${OPENAQ_ORG_SLUG:-agglo-riviera}
      OPENAQ_MAX_PAGES: ${OPENAQ_MAX_PAGES:-50}
      INGEST_INTERVAL_SECS: ${INGEST_INTERVAL_SECS:-3600}
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      back: { condition: service_healthy }

  # --- Front React/Vite — login + série temporelle (nginx sert le statique + proxy /api -> back) ---
  front:
    build: ./front
    container_name: quarity_front
    restart: unless-stopped
    ports:
      - "${FRONT_PORT:-3000}:80"
    depends_on:
      - back

volumes:
  pgdata:
  clickhouse_data:
  redis_data:
